# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: search-boolean-props-without-dot
language: html
severity: hint
rule:
  pattern:
    context: |
      <TAG $ATTRIBUTE_NAME=$ATTRIBUTE_VALUE>
    selector: attribute
  inside:
    kind: start_tag
    has:
      kind: tag_name
      pattern: $TAG_NAME

    # kind: attribute_name
