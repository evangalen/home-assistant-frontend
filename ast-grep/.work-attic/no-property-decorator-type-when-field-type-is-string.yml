# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: no-property-decorator-type-when-field-type-is-string
language: ts
severity: error
message: "Unnecessary explicit type specified for @property decorator with field type of string."

rule:
  pattern:
    context: |
      { type: $_ }
    selector: pair
  inside:
    stopBy: end
    pattern: |
      @property($OPTIONS_OBJECT)
    inside:
      kind: public_field_definition
      any:
        - has: # has `: boolean` type annotation
            field: type
            has: { kind: predefined_type, regex: ^string$ }
        - has: # has `=` with string literal
            field: value
            kind: string
        - has: # has `=` with template string
            field: value
            kind: template_string

constraints:
  OPTIONS_OBJECT:
    has:
      kind: pair
      nthChild: 2

fix:
  template: ""
  expandStart: { regex: "," }
  expandEnd: { regex: "," }

---
id: no-property-decorator-type-when-field-type-is-string-only-pair
severity: error
language: ts

rule:
  pattern: |
    @property($OPTIONS_OBJECT)
  inside:
    kind: public_field_definition
    any:
      - has: # has `: boolean` type annotation
          field: type
          has: { kind: predefined_type, regex: ^string$ }
      - has: # has `=` with string literal
          field: value
          kind: string
      - has: # has `=` with template string
          field: value
          kind: template_string

constraints:
  OPTIONS_OBJECT:
    has:
      pattern:
        context: |
          { type: $_ }
        selector: pair
    not:
      has:
        kind: pair
        nthChild: 2

fix:
  template: "@property()"
