# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

# Rewrite rule introducing a Quick Fix inside your IDE (use LSP server of ast-grep) to change a
# `await act(() => Promise.resolve());` statement into a `await act(() => new Promise(resolve => setTimeout(resolve)));`
# statement.
id: rewrite-lsp-invert-flush-promises-from-basic-flush-promises
language: tsx
severity: hint
message: "Quick fix:"
rule:
  pattern: await act(() => Promise.resolve());
fix:
  - title: Use advanced flush promises
    template: await act(() => new Promise(resolve => setTimeout(resolve)));

---

