# Rewrite rule introducing a Quick Fix inside your IDE (use LSP server of ast-grep) to change a
# `expect(..).not.toBeInTheDocument()` statement into a `expect(..).toBeInTheDocument()` statement.
id: rewrite-lsp-invert-expect-to-be-in-the-document-remove-not
language: tsx
severity: hint
message: "Quick fix:"
rule:
  pattern: expect(screen.$QUERY_BY_SELECTOR($$$SELECTOR_ARGS)).not.toBeInTheDocument();
constraints:
  QUERY_BY_SELECTOR:
    regex: ^queryBy[A-Z]
transform:
  GET_BY_SELECTOR:
    replace:
      replace: ^query(?<REST>.*)$
      by: 'get$REST'
      source: $QUERY_BY_SELECTOR
fix:
  - title: Use `.toBeInTheDocument()` matcher with `getBy`.. selector
    template: |-
      expect(screen.$GET_BY_SELECTOR($$$SELECTOR_ARGS)).toBeInTheDocument();
