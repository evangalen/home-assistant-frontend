# yaml-language-server: $schema=https://raw.githubusercontent.com/ast-grep/ast-grep/main/schemas/rule.json

id: search-boolean-lit-properties
language: ts
rule:
  kind: public_field_definition # matches any field definition, even once with JS `#` prefix or TS `private` modifier
  all:
    - has: # has `@property(...)` decorator
        pattern:
          context: |
            class _ {
              @property($$$_) $$_: $_;
            }
          selector: decorator
    - any:
        - has: # has `: boolean` type annotation
            field: type
            has: { kind: predefined_type, regex: ^boolean$ }
        - has: # has `= true` or `= false`
            field: value
            regex: ^(true|false)$
