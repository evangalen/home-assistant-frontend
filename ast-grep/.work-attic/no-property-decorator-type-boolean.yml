id: no-property-decorator-type-boolean
language: ts
rule:
  all:
    - pattern: |
        @property($OBJECT)
    - pattern: |
        @property({ $$$OBJECT_PAIRS })
  inside:
    kind: public_field_definition
    any:
      - has: # has `: boolean` type annotation
          field: type
          has: { kind: predefined_type, regex: ^boolean$ }
      - has: # has `= true` or `= false`
          field: value
          regex: ^(true|false)$
constraints:
  OBJECT:
    kind: object
    all:
      - not:
          {
            has:
              { pattern: { context: "{ attribute: false }", selector: pair } },
          }
      - not:
          { has: { pattern: { context: "{ type: Boolean }", selector: pair } } }

fix:
  template: |-
    @property({ type: Boolean, $$$OBJECT_PAIRS })
